
<!DOCTYPE html>
<html>
<head>
<title>TechSavvy Store</title>
<style>
body{font-family:Arial;background:#eee;margin:0}
header,footer{background:#173b68;color:white;text-align:center;padding:15px}
main{padding:20px}
input,button{padding:10px;margin:5px}
.products{display:flex;flex-wrap:wrap;gap:15px}
.card{background:white;padding:15px;border-radius:8px;width:180px}
button{background:#1769d2;color:white;border:0;cursor:pointer}
</style>
</head>
<body>

<header>
<h1>TechSavvy Electronics</h1>
<p>Online Shopping Store</p>
</header>

<main>
<h2>Products</h2>
<input id="search" placeholder="Search products" oninput="display()">
<div class="products" id="products"></div>

<h2>Shopping Cart</h2>
<div id="cart"></div>
<h3 id="total">Total: ₹0</h3>
<button onclick="checkout()">Checkout</button>
</main>

<footer>TechSavvy Electronics © 2026</footer>

<script>
let items=[
{name:"Laptop",price:55000},
{name:"Mobile",price:25000},
{name:"Headphones",price:2000},
{name:"Tablet",price:15000}
];
let cart=[];

function display(){
let q=document.getElementById("search").value.toLowerCase();
document.getElementById("products").innerHTML=
items.filter(p=>p.name.toLowerCase().includes(q))
.map((p,i)=>`<div class="card">
<h3>${p.name}</h3>
<p>Price: ₹${p.price}</p>
<button onclick="add(${items.indexOf(p)})">Add to Cart</button>
</div>`).join("");
}

function add(i){
cart.push(items[i]);
showCart();
}

function showCart(){
document.getElementById("cart").innerHTML=
cart.map(p=>`<p>${p.name} - ₹${p.price}</p>`).join("");
document.getElementById("total").innerText=
"Total: ₹"+cart.reduce((s,p)=>s+p.price,0);
}

function checkout(){
if(cart.length===0){alert("Cart is empty");return;}
alert("Order placed successfully!");
cart=[];
showCart();
}

display();
</script>
</body>
</html>
