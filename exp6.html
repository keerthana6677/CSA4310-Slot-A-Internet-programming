
<!DOCTYPE html>
<html>
<head>
<title>Sweet Cake Shop</title>
<style>
body{font-family:Arial;background:#fff5f7;margin:0;color:#333}
header,nav,footer{background:#831843;color:white;text-align:center;padding:15px}
button{background:#db2777;color:white;border:0;padding:9px;margin:5px;cursor:pointer}
.container{max-width:1000px;margin:20px auto;padding:10px}
.card,.cake{background:white;padding:15px;margin:10px;border-radius:8px;box-shadow:0 2px 6px #ddd}
input,select,textarea{padding:10px;margin:6px;width:90%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
img{width:100%;height:140px;object-fit:cover}
.hidden{display:none}
</style>
</head>
<body>

<header><h1>🎂 Sweet Cake Shop</h1><p>Order Your Favourite Cake</p></header>
<nav>
<button onclick="show('shop')">Home</button>
<button onclick="show('register')">Register</button>
<button onclick="show('login')">Login</button>
<button onclick="show('cart')">Cart (<span id="count">0</span>)</button>
<button onclick="show('orders')">My Orders</button>
<button onclick="show('admin')">Admin</button>
<button onclick="logout()">Logout</button>
</nav>

<div class="container">

<section id="shop" class="card">
<h2>Our Cakes</h2>
<input id="search" placeholder="Search cakes" oninput="display()">
<select id="category" onchange="display()">
<option value="">All Categories</option>
<option>Birthday</option><option>Chocolate</option>
<option>Fruit</option><option>Wedding</option>
</select>
<div id="cakes" class="grid"></div>
</section>

<section id="register" class="card hidden">
<h2>Register</h2>
<input id="rname" placeholder="Name">
<input id="remail" type="email" placeholder="Email">
<input id="rpass" type="password" placeholder="Password">
<button onclick="register()">Register</button>
</section>

<section id="login" class="card hidden">
<h2>Customer Login</h2>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</section>

<section id="cart" class="card hidden">
<h2>Shopping Cart</h2>
<div id="items"></div>
<h3 id="total">Total: ₹0</h3>
<button onclick="show('checkout')">Checkout</button>
</section>

<section id="checkout" class="card hidden">
<h2>Delivery Details</h2>
<input id="address" placeholder="Delivery Address">
<input id="phone" placeholder="10-digit Phone Number">
<input id="date" type="date">
<select id="payment"><option>Cash on Delivery</option><option>Online Payment (Demo)</option></select>
<button onclick="order()">Place Order</button>
</section>

<section id="orders" class="card hidden">
<h2>My Orders</h2><div id="myorders"></div>
</section>

<section id="admin" class="card hidden">
<h2>Admin Login</h2>
<input id="ae" placeholder="Admin Email">
<input id="ap" type="password" placeholder="Password">
<button onclick="adminLogin()">Login</button>
<div id="panel" class="hidden">
<h3>Add Cake</h3>
<input id="cn" placeholder="Cake Name">
<input id="cp" type="number" placeholder="Price">
<input id="cc" placeholder="Category">
<input id="stock" type="number" placeholder="Stock">
<button onclick="addCake()">Add Cake</button>
<h3>Manage Cakes</h3><div id="manage"></div>
<h3>Manage Orders</h3><div id="manageOrders"></div>
</div>
</section>

</div>
<footer>© 2026 Sweet Cake Shop</footer>

<script>
let products=JSON.parse(localStorage.cakes||"null")||[
{id:1,name:"Chocolate Cake",price:550,category:"Chocolate",stock:10,image:"https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=500"},
{id:2,name:"Birthday Cake",price:750,category:"Birthday",stock:8,image:"https://images.unsplash.com/photo-1558636508-e0db3814bd1d?w=500"},
{id:3,name:"Strawberry Cake",price:650,category:"Fruit",stock:6,image:"https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=500"}
];
let users=JSON.parse(localStorage.users||"[]");
let orders=JSON.parse(localStorage.orders||"[]");
let cart=[],user=null,admin=false;

function save(){
localStorage.cakes=JSON.stringify(products);
localStorage.users=JSON.stringify(users);
localStorage.orders=JSON.stringify(orders);
}
function show(id){
if(["checkout","orders"].includes(id)&&!user){alert("Please login first");id="login"}
document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
if(id==="shop")display();
if(id==="cart")showCart();
if(id==="orders")showOrders();
}
function display(){
let q=search.value.toLowerCase(),c=category.value;
cakes.innerHTML=products.filter(p=>p.name.toLowerCase().includes(q)&&(!c||p.category===c)).map(p=>
`<div class="cake"><img src="${p.image}" alt="${p.name}">
<h3>${p.name}</h3><p>₹${p.price}</p><p>Stock: ${p.stock}</p>
<button onclick="add(${p.id})" ${p.stock<1?"disabled":""}>Add to Cart</button></div>`).join("");
}
function register(){
let n=rname.value,e=remail.value.toLowerCase(),p=rpass.value;
if(!n||!e||p.length<6)return alert("Enter valid details (password: 6+ characters)");
if(users.some(u=>u.email===e))return alert("Email already exists");
users.push({name:n,email:e,password:p});save();alert("Registered!");
show("login");
}
function login(){
let u=users.find(x=>x.email===email.value.toLowerCase()&&x.password===pass.value);
if(!u)return alert("Invalid login");
user=u;alert("Login successful");show("shop");
}
function adminLogin(){
if(ae.value==="admin@cakeshop.com"&&ap.value==="admin123"){
admin=true;panel.classList.remove("hidden");manageCakes();manageOrders();
}else alert("Invalid admin details");
}
function logout(){user=null;admin=false;show("shop")}
function add(id){
let p=products.find(x=>x.id===id),i=cart.find(x=>x.id===id);
if(!p||p.stock<1)return alert("Out of stock");
if(i){if(i.qty>=p.stock)return alert("Stock limit reached");i.qty++}
else cart.push({id,qty:1});
count.innerText=cart.reduce((s,x)=>s+x.qty,0);
}
function showCart(){
let sum=0;
items.innerHTML=cart.map(i=>{
let p=products.find(x=>x.id===i.id);sum+=p.price*i.qty;
return `<p>${p.name} × ${i.qty} - ₹${p.price*i.qty}
<button onclick="removeItem(${i.id})">Remove</button></p>`;
}).join("")||"Cart is empty";
total.innerText="Total: ₹"+sum;
count.innerText=cart.reduce((s,x)=>s+x.qty,0);
}
function removeItem(id){cart=cart.filter(x=>x.id!==id);showCart()}
function order(){
if(!user||!cart.length)return alert("Login and add cakes first");
if(!address.value||!/^[0-9]{10}$/.test(phone.value)||!date.value)return alert("Enter valid delivery details");
if(date.value<new Date().toISOString().slice(0,10))return alert("Choose a future date");
for(let i of cart)if(products.find(p=>p.id===i.id).stock<i.qty)return alert("Insufficient stock");
let total=cart.reduce((s,i)=>s+products.find(p=>p.id===i.id).price*i.qty,0);
orders.push({id:Date.now(),email:user.email,address:address.value,phone:phone.value,date:date.value,total,status:"Order Placed",items:cart.map(i=>({name:products.find(p=>p.id===i.id).name,qty:i.qty}))});
cart.forEach(i=>products.find(p=>p.id===i.id).stock-=i.qty);
cart=[];save();alert("Order placed!");show("orders");
}
function showOrders(){
myorders.innerHTML=orders.filter(o=>o.email===user.email).map(o=>
`<div class="card">Order #${o.id}<p>Total: ₹${o.total}</p>
<p>Delivery: ${o.date}</p><p>Status: ${o.status}</p></div>`).join("")||"No orders";
}
function addCake(){
if(!admin)return;
if(!cn.value||Number(cp.value)<=0||!cc.value||Number(stock.value)<0)return alert("Enter valid details");
products.push({id:Date.now(),name:cn.value,price:Number(cp.value),category:cc.value,stock:Number(stock.value),image:""});
save();manageCakes();display();
}
function manageCakes(){
manage.innerHTML=products.map(p=>
`<p>${p.name} - ₹${p.price} | Stock: ${p.stock}
<button onclick="deleteCake(${p.id})">Delete</button></p>`).join("");
}
function deleteCake(id){
if(confirm("Delete this cake?")){products=products.filter(p=>p.id!==id);save();manageCakes();display()}
}
function manageOrders(){
manageOrdersDiv();
}
function manageOrdersDiv(){
manageOrders.innerHTML=orders.map(o=>
`<p>Order ${o.id} - ${o.status}
<select id="s${o.id}"><option>Order Placed</option><option>Preparing</option><option>Shipped</option><option>Delivered</option></select>
<button onclick="updateOrder(${o.id})">Update</button></p>`).join("")||"No orders";
}
function updateOrder(id){
let o=orders.find(x=>x.id===id);o.status=document.getElementById("s"+id).value;save();manageOrdersDiv();
}
display();save();
</script>
</body>
</html>
